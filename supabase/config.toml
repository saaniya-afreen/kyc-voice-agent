project_id = "kyc-voice-agent"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322

# trigger-outbound-call is deliberately left out of this list (defaults to verify_jwt = true):
# it is only ever called from the dashboard with an authenticated officer's session.
# Every other function below is called directly by the voice platform, which has no
# Supabase session, so JWT verification is off and each checks a shared secret itself
# (see supabase/functions/_shared/auth.ts).
[functions]
[functions.verify-account]
verify_jwt = false
[functions.uc2-get-next-crs-country]
verify_jwt = false
[functions.uc2-store-tin-value]
verify_jwt = false
[functions.uc2-store-tin-reason]
verify_jwt = false
[functions.submit-kyc-screening]
verify_jwt = false
[functions.call-events]
verify_jwt = false
